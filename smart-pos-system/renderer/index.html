<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Smart POS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>Smart POS</h1>
      <button class="nav-btn active" data-view="pos">نقطة البيع</button>
      <button class="nav-btn" data-view="products">المنتجات</button>
      <button class="nav-btn" data-view="sales">سجل المبيعات</button>
      <button class="nav-btn" data-view="settings">الإعدادات</button>
      <button class="nav-btn" id="openKitchenBtn">شاشة المطبخ ⤴</button>
    </aside>

    <main class="main-content">
      <!-- POS View -->
      <section class="view active" id="view-pos">
        <div class="pos-layout">
          <div class="product-grid" id="productGrid"></div>
          <div class="cart-panel">
            <h3>الفاتورة الحالية</h3>
            <div class="cart-items" id="cartItems"></div>
            <div class="totals-box">
              <div class="row"><span>الإجمالي الفرعي</span><span id="subtotalText">0.00</span></div>
              <div class="row">
                <span>الخصم</span>
                <input type="number" id="discountInput" value="0" min="0" style="width:80px;background:#273549;border:1px solid #334155;color:#e2e8f0;border-radius:4px;padding:2px 6px;" />
              </div>
              <div class="row"><span>الضريبة</span><span id="taxText">0.00</span></div>
              <div class="row grand"><span>الإجمالي</span><span id="totalText">0.00</span></div>
            </div>
            <select id="paymentMethod" style="margin-top:8px;padding:8px;background:#273549;border:1px solid #334155;color:#e2e8f0;border-radius:6px;">
              <option value="cash">نقدًا</option>
              <option value="card">بطاقة</option>
            </select>
            <button class="primary" id="checkoutBtn">إتمام البيع</button>
            <button class="secondary" id="clearCartBtn" style="margin-top:8px;">إفراغ الفاتورة</button>
          </div>
        </div>
      </section>

      <!-- Products View -->
      <section class="view" id="view-products">
        <h2>إدارة المنتجات</h2>
        <div class="card-box">
          <div class="form-row"><label>اسم المنتج</label><input id="pName" /></div>
          <div class="form-row"><label>الباركود</label><input id="pBarcode" /></div>
          <div class="form-row"><label>الفئة</label><select id="pCategory"></select></div>
          <div class="form-row"><label>السعر</label><input id="pPrice" type="number" step="0.01" /></div>
          <div class="form-row"><label>التكلفة</label><input id="pCost" type="number" step="0.01" /></div>
          <div class="form-row"><label>الكمية بالمخزون</label><input id="pStock" type="number" step="1" /></div>
          <div class="form-row">
            <label><input type="checkbox" id="pTrackStock" /> تتبع المخزون</label>
          </div>
          <button class="primary" id="saveProductBtn">حفظ المنتج</button>
        </div>
        <table>
          <thead><tr><th>الاسم</th><th>الفئة</th><th>السعر</th><th>المخزون</th><th></th></tr></thead>
          <tbody id="productsTableBody"></tbody>
        </table>
      </section>

      <!-- Sales View -->
      <section class="view" id="view-sales">
        <h2>سجل المبيعات</h2>
        <table>
          <thead><tr><th>رقم الفاتورة</th><th>التاريخ</th><th>الإجمالي</th><th>طريقة الدفع</th></tr></thead>
          <tbody id="salesTableBody"></tbody>
        </table>
      </section>

      <!-- Settings View -->
      <section class="view" id="view-settings">
        <h2>الإعدادات</h2>
        <div class="card-box">
          <div class="form-row"><label>اسم المتجر</label><input id="sStoreName" /></div>
          <div class="form-row"><label>رمز العملة</label><input id="sCurrency" /></div>
          <div class="form-row"><label>نسبة الضريبة %</label><input id="sTax" type="number" step="0.1" /></div>
          <button class="primary" id="saveSettingsBtn">حفظ الإعدادات</button>
        </div>
        <div class="card-box">
          <h3>إضافة فئة جديدة</h3>
          <div class="form-row"><label>اسم الفئة</label><input id="catName" /></div>
          <div class="form-row"><label><input type="checkbox" id="catIsKitchen" /> فئة مطبخ (تظهر في شاشة المطبخ)</label></div>
          <button class="secondary" id="addCategoryBtn">إضافة الفئة</button>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
