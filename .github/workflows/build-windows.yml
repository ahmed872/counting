# Builds the Windows copy on GitHub's own machines, so nobody has to install
# Python to produce it - not the customer, and not whoever is sending it.
#
# Two ways to use it:
#
#   One-off build:  Actions -> "بناء نسخة ويندوز" -> Run workflow, then take
#                   the zip from the run's Artifacts section.
#
#   For customers:  push a tag (git tag v1.0 && git push origin v1.0). The
#                   same build is attached to a GitHub Release, which gives a
#                   permanent download link that can be sent to any number of
#                   customers instead of mailing files around.
#
# PyInstaller cannot cross-compile, which is why this runs on windows-latest
# rather than the default ubuntu runner.

name: بناء نسخة ويندوز

on:
  workflow_dispatch:        # the "Run workflow" button
  push:
    tags:
      - "v*"

permissions:
  contents: write           # needed to create the release on a tag

jobs:
  build:
    runs-on: windows-latest

    env:
      # The project is full of Arabic file names; without this the runner falls
      # back to the legacy code page and mangles them.
      PYTHONUTF8: "1"
      # No display on a CI runner, and the manual is generated through Qt.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: فحص البرنامج قبل البناء
        # Shipping a build that fails its own checks is worse than shipping
        # nothing, so the tests gate the artifact.
        run: python tests/test_app.py

      # The manual and the icon are NOT regenerated here. They are committed,
      # and they are committed because they were checked by eye - pages
      # rendered to images and actually looked at, the icon inspected at every
      # size it ships in.
      #
      # Regenerating the manual on the runner produced a PDF whose every glyph
      # was an empty box: Qt found no font with Arabic coverage on a headless
      # Windows image and silently substituted one, and the build happily
      # shipped it. A document nobody can read is worse than no document, and
      # nothing in the job could have noticed. So the build uses the file that
      # was verified, and verify_artifacts below refuses to continue if that
      # file is not intact.
      - name: التحقق من الدليل والأيقونة
        run: python packaging/verify_artifacts.py

      # The licence PUBLIC key. It lives in this repository's Actions secrets
      # and is written into a git-ignored module just before packaging, so it
      # is baked into the executable without ever appearing in the source.
      # This is deliberately only ever the public half of the Ed25519
      # keypair (P1-4) - the private half that actually signs activation
      # keys lives only wherever packaging/make_key.py is run from
      # (RESTAURANT_ERP_PRIVATE_KEY, used by the separate "توليد مفتاح
      # تفعيل" workflow), and is never referenced here.
      #
      # The build stops if it is not configured. Shipping with the dev key
      # published in logic/licence.py would mean anyone who reads the
      # repository can mint activation keys, and the whole thing would be
      # decoration - a failure that would not show up until it mattered.
      - name: تجهيز المفتاح العام للترخيص
        shell: pwsh
        env:
          LICENCE_PUBLIC_KEY: ${{ secrets.RESTAURANT_ERP_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LICENCE_PUBLIC_KEY)) {
            Write-Host "::error::المفتاح العام للترخيص غير مضبوط."
            Write-Host "أضفه من: Settings -> Secrets and variables -> Actions -> New repository secret"
            Write-Host "الاسم: RESTAURANT_ERP_PUBLIC_KEY   القيمة: المفتاح العام (hex) الناتج من توليد زوج مفاتيح Ed25519"
            Write-Host "بدونه تخرج النسخة بالمفتاح التجريبي المنشور في الكود، ويستطيع أي شخص توليد مفاتيح تفعيل صالحة."
            exit 1
          }
          $escaped = $env:LICENCE_PUBLIC_KEY -replace '\\','\\\\' -replace '"','\"'
          Set-Content -Path logic/_licence_key.py -Encoding utf8 -Value "PUBLIC_KEY_HEX = `"$escaped`""
          python -c "import sys; sys.path.insert(0,'.'); from logic.licence import using_development_key; sys.exit(1 if using_development_key() else 0)"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::لم يُحمَّل المفتاح العام"; exit 1 }
          Write-Host "تم تجهيز المفتاح العام للترخيص."

      # Both builds come from the same spec, so they need separate --workpath
      # directories: PyInstaller caches its intermediates under a name derived
      # from the spec, and the second build would otherwise pick up the first
      # one's leftovers.

      # ---- what the customer actually receives: one file ----
      - name: بناء الملف الواحد
        env:
          ONEFILE: "1"
        run: python -m PyInstaller packaging/restaurant_erp.spec --noconfirm --distpath dist-single --workpath build/single

      # ---- the folder version, for when the single file is blocked or slow ----
      - name: بناء نسخة المجلد
        run: python -m PyInstaller packaging/restaurant_erp.spec --noconfirm --distpath dist-folder --workpath build/folder

      - name: تجهيز الملفات للإرسال
        shell: pwsh
        run: |
          Copy-Item "packaging/اقرأني-قبل-التشغيل.txt" -Destination dist-single
          Copy-Item "docs/دليل-الاستخدام.pdf" -Destination dist-single
          $folder = Get-ChildItem -Path dist-folder -Directory | Select-Object -First 1
          Copy-Item "packaging/اقرأني-قبل-التشغيل.txt" -Destination $folder.FullName
          Get-ChildItem dist-single | Format-Table Name, Length

      - name: رفع النسخة (ملف واحد)
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-erp-single-file
          path: dist-single/
          retention-days: 30

      - name: رفع النسخة (مجلد)
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-erp-folder
          path: dist-folder/
          retention-days: 30

      # Only on a tag: publish a permanent link that can be handed to customers.
      - name: نشر إصدار
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist-folder/* -DestinationPath "نظام-إدارة-المطعم-مجلد.zip"
          $exe = Get-ChildItem -Path dist-single -Filter *.exe | Select-Object -First 1
          gh release create "${{ github.ref_name }}" `
            "$($exe.FullName)" `
            "نظام-إدارة-المطعم-مجلد.zip" `
            "docs/دليل-الاستخدام.pdf" `
            --title "نظام إدارة المطعم ${{ github.ref_name }}" `
            --notes "نسخة تجريبية تعمل 20 يوماً من أول تشغيل على كل جهاز. حمّل ملف exe وشغّله مباشرة - لا يحتاج تثبيت."
