# Builds the Windows copy on GitHub's own machines, so nobody has to install
# Python to produce it - not the restaurant, and not whoever is sending it.
#
# How to use it:
#   GitHub -> Actions -> "بناء نسخة ويندوز" -> Run workflow
#   wait ~3 minutes, then download the zip from the run's Artifacts section.
#
# PyInstaller cannot cross-compile, which is why this runs on windows-latest
# rather than the default ubuntu runner.

name: بناء نسخة ويندوز

on:
  workflow_dispatch:        # the "Run workflow" button
  push:
    tags:
      - "v*"                # tagging a release builds one automatically

jobs:
  build:
    runs-on: windows-latest

    env:
      # The project is full of Arabic file names; without this the runner falls
      # back to the legacy code page and mangles them.
      PYTHONUTF8: "1"
      # No display on a CI runner, and the manual is generated through Qt.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: فحص البرنامج قبل البناء
        # Shipping a build that fails its own checks is worse than shipping
        # nothing, so the tests gate the artifact.
        run: python tests/test_app.py

      - name: توليد دليل الاستخدام
        run: python docs/build_manual.py

      - name: البناء
        run: python -m PyInstaller packaging/restaurant_erp.spec --noconfirm

      - name: إضافة ورقة التعليمات بجانب البرنامج
        shell: pwsh
        run: |
          $target = Get-ChildItem -Path dist -Directory | Select-Object -First 1
          Copy-Item "packaging/اقرأني-قبل-التشغيل.txt" -Destination $target.FullName
          Write-Host "المجلد الجاهز: $($target.FullName)"

      - name: رفع النسخة الجاهزة
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-erp-windows
          path: dist/
          retention-days: 30
